sonar.projectKey=bookshop-api-node
sonar.projectName=Bookshop API Node
sonar.sources=src
sonar.tests=tests
sonar.exclusions=node_modules/**
sonar.sourceEncoding=UTF-8

# Bootstrap/infra glue that needs a live process + Mongo to exercise, not
# business logic — excluded from Jest's coverage collection too (see
# package.json's jest.collectCoverageFrom). Keeps this metric scoped the
# same way in both tools instead of SonarQube's Zero Coverage Sensor
# silently averaging these in as 0% covered.
sonar.coverage.exclusions=src/server.js,src/db/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
