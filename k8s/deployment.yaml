apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookshop-api
  labels:
    app: bookshop-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookshop-api
  template:
    metadata:
      labels:
        app: bookshop-api
    spec:
      containers:
        - name: bookshop-api
          image: yourdockerhubusername/bookshop-api-node:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: mongodb://mongo:27017/book
            - name: PORT
              value: "8080"
            - name: JWT_SECRET
              value: change-me-in-a-real-deployment
